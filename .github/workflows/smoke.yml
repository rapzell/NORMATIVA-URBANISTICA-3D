name: Smoke Test

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-windows:
    runs-on: windows-latest
    continue-on-error: ${{ matrix.allow_failure || false }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        format: [cityjson, glb]
        lib: [jsdelivr, unpkg]
        include:
          # Variantes opcionales con librería local; no deben bloquear el pipeline
          - format: cityjson
            lib: local
            allow_failure: true
          - format: glb
            lib: local
            allow_failure: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Pytest tiene su propio workflow dedicado; mantener smoke ligero y aislado

      - name: Setup Node for HTML lint
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint viewer HTML (htmlhint)
        shell: bash
        run: |
          npx --yes htmlhint web/examples/threejs-viewer/index.html

      - name: Lint PowerShell scripts (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          if ($results) {
            Write-Host "PSScriptAnalyzer found errors:" -ForegroundColor Red
            $results | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          } else { Write-Host "PSScriptAnalyzer: no errors." -ForegroundColor Green }

      - name: Run viewer demo smoke test
        shell: pwsh
        env:
          API_LOAD_RESOURCES: '0'
          LOGDIR: ${{ runner.temp }}\viewer-logs-${{ matrix.format }}-${{ matrix.lib }}
        run: |
          # Ejecuta el smoke sin abrir navegador; valida /viewer/ y POST /zoning/volume-export
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\run_viewer_demo.ps1 -Format ${{ matrix.format }} -Lib ${{ matrix.lib }} -Municipio Vigo -UsePlanFrontDefault -Altura 8 -Port 8010 -Smoke -Echo -LogDir "$env:LOGDIR" -StartupTimeoutSec 240 -RetryCount 3 -RetryDelaySec 3 -RetryBackoff exponential

      - name: Upload viewer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-logs-${{ matrix.format }}-${{ matrix.lib }}
          path: ${{ runner.temp }}\viewer-logs-${{ matrix.format }}-${{ matrix.lib }}
          retention-days: 7
